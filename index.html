<!-- index.html
Serverless multiplayer via webrtc/camera/barcode (no signal/stun/turn servers). 
Shows a toolbar (Handshake / Play / Back) and runs a game on both phones.
Flow: Handshake connects the phones (handshake(container) resolves to {link, side}), the code screen shows the game source in a textarea, and Play sends that code to the other phone and launches it on both. Back returns BOTH phones to the code screen. Long-press Handshake for a single-device dev bypass.
Shell messages travel over the same link as game messages but use a {sys:...} envelope that link.sys() receives, so games can never overwrite them: {sys:"load",code} starts a game, {sys:"back"} returns both phones to the code screen, {sys:"error",msg} reports that the other phone couldn't load or run the game. Games only ever see link.on for their own messages.
-->

<!DOCTYPE html><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Two-Phone Game Loader</title><body><script src="datamatrix.js"></script><script src="sample.js"></script><script>

init();

function element(tag,parent,props){let e=document.createElement(tag);parent?.append(e);return Object.assign(e,props)}

function init(){

element("style",document.head,{textContent:`
  html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111;color:#fff;font-family:monospace}body{display:flex;flex-direction:column;align-items:center;text-align:center}
  .toolbar{display:flex;flex-shrink:0;width:100%;background:#181818;border-bottom:2px solid #007acc}
  .toolbar button{flex:1;padding:14px;background:#222;color:#555;border:0;border-right:1px solid #111;font:14px monospace;user-select:none}.toolbar button:enabled{background:#007acc;color:#fff}
  .screen{display:none;flex:1;min-height:0;width:100%;flex-direction:column;align-items:center;justify-content:center;box-sizing:border-box;padding:20px;overflow:hidden;position:relative}.screen.on{display:flex}
  .intro,.code{overflow-y:auto;justify-content:flex-start}
  .game{background:#000;contain:paint}
  .game iframe{flex:1;min-height:0;width:100%;border:0}
  .code textarea{width:100%;max-width:420px;height:60vh;background:#000;color:#0f0;border:1px solid #444;padding:10px;font:12px monospace;box-sizing:border-box;resize:vertical;text-align:left}
  .code select{width:100%;max-width:420px;margin-bottom:8px;padding:10px;background:#222;color:#fff;border:1px solid #444;font:14px monospace;box-sizing:border-box}`})

let link,side,ssrc="",sname="",running=0,cleanup,body=document.body,
  toolbar=element("div",body,{className:"toolbar"}),
  [hand,play,back]=["Handshake","Play","Back"].map(text=>element("button",toolbar,{textContent:text})),
  makescreen=props=>element("div",body,{className:"screen",...props}),
  intro=makescreen({className:"screen intro on"}),
  hscreen=makescreen(),cscreen=makescreen({className:"screen code"}),
  nbox=element("select",cscreen),cbox=element("textarea",cscreen),gbox=makescreen({className:"screen game"}),
  show=s=>[...body.children].forEach(x=>x.classList.toggle("on",x==s)),enable=b=>[hand,play,back].forEach(x=>x.disabled=x!=b)

let FRAME='<!DOCTYPE html><meta name="viewport" content="width=device-width,initial-scale=1"><body style="margin:0;background:#000;color:#fff;font:16px monospace">',
  db=new Promise((ok,no)=>{let r=indexedDB.open("games",1);r.onupgradeneeded=()=>r.result.createObjectStore("games");r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)}),
  store=(mode,op)=>db.then(d=>new Promise((ok,no)=>{let r=op(d.transaction("games",mode).objectStore("games"));r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)})),
  gname=fn=>fn.toString().match(/^[^(]*\(\s*\w+\s*,\s*\w+\s*,\s*\w+\s*,\s*\w+\s*=\s*(["'])(\w+)\1\s*[,)]/)?.[2];

db.catch(()=>{});
nbox.onchange=()=>{let n=nbox.value;if(n==sname)cbox.value=ssrc;else store("readonly",s=>s.get(n)).then(c=>{if(c!=null)cbox.value=c}).catch(()=>{})};
hand.onclick=()=>{enable();show(hscreen);handshake(hscreen).then(r=>connected(r.link,r.side)).catch(e=>{alert("Handshake error: "+e.message);show(intro);enable(hand)})}
play.onclick=()=>{let src=cbox.value;load(src,(g,err)=>{if(!g)return alert("Failed to load game code: "+err.message);link.send({sys:"load",code:src});save(src,g.fn);let e=start(g);if(e){goback(true);alert("Error running game: "+e.message)}})}
back.onclick=()=>goback(true)

enable(hand)

function onsys(m){
  if(m.sys=="load"){if(running||typeof m.code!="string")return;cbox.value=m.code;load(m.code,(g,err)=>{let e=err||start(g);if(e){link.send({sys:"error",msg:e.message});g&&goback(false);alert("Received game failed: "+e.message)}})}
  else if(m.sys=="back"){running&&goback(false)}
  else if(m.sys=="error"&&running){goback(false);alert("The other phone couldn't run the game: "+m.msg)}
}

function load(src,cb){
  running=1;show(gbox);enable(back);gbox.innerHTML="";
  let ifr=element("iframe",gbox);
  ifr.onload=()=>{
    if(!ifr.isConnected)return;
    let win=ifr.contentWindow,fn;
    try{fn=parsegame(src,win)}catch(e){goback(false);return cb(null,e)}
    cb({fn,ifr})
  };
  ifr.srcdoc=FRAME
}

function start({fn,ifr}){link.reset();try{let r=fn(link,side,{w:ifr.clientWidth,h:ifr.clientHeight});typeof r=="function"&&(cleanup=r)}catch(e){return e}}
function goback(notify){notify&&link.send({sys:"back"});try{cleanup?.()}catch{}cleanup=0;running=0;link.reset();gbox.innerHTML="";show(cscreen);enable(play)}
function connected(l,s){link=l;side=s;link.sys=onsys;if(typeof game=="function"){sname=gname(game)||"";ssrc=game.toString()}cbox.value=ssrc;refresh();show(cscreen);enable(play)}
function save(src,fn){let name=gname(fn);if(!name)return;if(name==sname){if(src!=ssrc)alert("sample can't be changed");return}store("readwrite",s=>s.put(src,name)).then(()=>refresh(name)).catch(()=>{})}
function refresh(pick){return store("readonly",s=>s.getAllKeys()).catch(()=>[]).then(keys=>{let names=[...(sname?[sname]:[]),...keys.sort()];nbox.innerHTML="";names.forEach(n=>element("option",nbox,{textContent:n,value:n}));nbox.value=pick||sname||names[0]||""})}
function hold(el,callback,timer){el.onpointerdown=_=>timer=setTimeout(callback,500);el.onpointerup=el.onpointercancel=_=>clearTimeout(timer)}hold(hand,()=>hand.disabled||connected({send(){},on(){},ready(f){f()},reset(){}},"a"));hand.oncontextmenu=()=>false
function parsegame(src,W=window){if(/\b(function|const|let|var)\s+game\b/.test(src))try{let fn=new W.Function("link","side","area",src+"\nreturn typeof game=='function'?game:null")();if(fn)return fn}catch{}return new W.Function("link","side","area",src)}

}

function handshake(container){return new Promise((resolve,reject)=>{

let peer,chan,stream,last="",dm,answering=0,
  box=element("div",container,{style:"position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#000;gap:8px;padding:8px;box-sizing:border-box;overflow:hidden"}),
  ctx=element("canvas",box,{style:"max-width:85vw;max-height:35vh;object-fit:contain"}).getContext("2d"),
  vid=element("video",box,{hidden:true,muted:true}),
  ovl=element("div",box,{textContent:"SCAN OK!",style:"position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font:20px sans-serif;background:rgba(0,128,0,.8);opacity:0;transition:opacity .3s;pointer-events:none"}),
  note=element("div",box,{textContent:"Point your camera at the barcode on the other phone",style:"color:#0f0;font-size:13px"});

navigator.mediaDevices.getUserMedia({video:{facingMode:"environment"}}).then(startcamera).catch(e=>fail(Error("Camera or scanner error: "+e.message)))

async function startcamera(s){
  stream=vid.srcObject=s;await vid.play();
  let det=new BarcodeDetector({formats:["data_matrix"]});
  async function loop(){
    if(!stream)return;
    ({videoWidth:ctx.canvas.width,videoHeight:ctx.canvas.height}=vid);
    ctx.drawImage(vid,0,0,ctx.canvas.width,ctx.canvas.height);
    try{let[hit]=await det.detect(ctx.canvas);hit&&scanned(hit.rawValue)}catch{}
    requestAnimationFrame(loop)
  }
  offer();loop()
}

async function scanned(s){
  if(s==last||s.length<20)return;
  last=s;
  let k=s[0];
  if(answering||!"oa".includes(k))return;
  try{
    if(k=="o"){
      answering=1;ctx.canvas.style.display="none";
      peer=new RTCPeerConnection;
      peer.ondatachannel=e=>{chan=e.channel;chan.onopen=()=>launch("b")};
      await peer.setRemoteDescription({type:"offer",sdp:sdpunstrip(s)});
      showbarcode(await gather(peer,await peer.createAnswer()));
      note.textContent="Now hold this barcode up to the other phone"
    }else await peer.setRemoteDescription({type:"answer",sdp:sdpunstrip(s)});
    ovl.style.opacity=1;setTimeout(()=>ovl.style.opacity=0,1000)
  }catch(e){note.textContent=e.message}
}

function showbarcode(text){
  dm?.remove();
  let[grid,n]=datamatrix(text),m=n+4,cell=Math.floor(Math.min(innerWidth*.6,innerHeight*.25)/m)||1,W=cell*m,c=element("canvas",null,{width:W,height:W,style:"max-height:25vh;object-fit:contain"}).getContext("2d");
  c.fillStyle="#fff";c.fillRect(0,0,W,W);c.fillStyle="#000";
  grid.forEach((row,j)=>row.forEach((v,i)=>v&&c.fillRect((i+2)*cell,(j+2)*cell,cell,cell)));
  box.prepend(dm=c.canvas)
}

async function gather(pc,desc){
  let done=new Promise(r=>{pc.onicecandidate=e=>e.candidate||r();setTimeout(r,4000)});
  await pc.setLocalDescription(desc);await done;
  return sdpstrip(pc.localDescription.sdp)
}

function makelink(chan){
  let me=0,them=0,start,go=()=>me&&them&&(me=them=0,start()),
  link={
    send(o){try{chan.send(JSON.stringify(o))}catch{}},
    sys(){},on(){},
    ready(fn){me=1;start=fn;link.send({sys:"rdy"});go()},
    reset(){me=them=0;start=null;link.on=()=>{};link.onclose=null}
  };
  chan.onmessage=({data})=>{let m;try{m=JSON.parse(data)}catch{return}if(!m||typeof m!="object")return;m.sys=="rdy"?(them=1,go()):m.sys?link.sys(m):link.on(m)}
  chan.onclose=()=>link.onclose?.();
  return link
}

function sdpstrip(sdp){
  function H2B(hex){return btoa(String.fromCharCode(...(hex.match(/../g)||[]).map(x=>parseInt(x,16)))).replace(/=/g,"")}
  let g=k=>sdp.match(RegExp("^a="+k+"(.+)","m"))?.[1],
  cands=(sdp.match(/^a=candidate:.+$/gm)||[]).map(l=>l.split(" ")).filter(c=>/udp/i.test(c[2])),
  c=cands.find(c=>!c[4].includes(":"))||cands[0],
  f=[/^a=setup:active/m.test(sdp)?"a":"o",g("ice-ufrag:"),g("ice-pwd:"),H2B((g("fingerprint:sha-256 ")||"").replace(/:/g,"")),c&&c[4],c&&c[5]];
  if(f.some(v=>!v))throw Error("SDP missing a field (no UDP candidate?)");
  return f.join("|")
}

function sdpunstrip(s,[type,ufrag,pwd,fp,ip,port]=s.split("|")){
  function B2H(b64){return [...atob(b64)].map(c=>(256+c.charCodeAt()).toString(16).slice(1)).join(":").toUpperCase()}
  return["v=0","o=- 1 2 IN IP4 0.0.0.0","s=-","t=0 0","m=application 9 UDP/DTLS/SCTP webrtc-datachannel","a=ice-ufrag:"+ufrag,"a=ice-pwd:"+pwd,"a=fingerprint:sha-256 "+B2H(fp),"a=setup:"+(type=="o"?"actpass":"active"),"a=candidate:1 1 udp 2113937151 "+ip+" "+port+" typ host","a=end-of-candidates",""].join("\r\n")
}

function fail(e){stop();reject(e)}
function launch(side){stop();resolve({link:makelink(chan),side})}
function stop(){stream?.getTracks().forEach(t=>t.stop());stream=0;box.remove()}
async function offer(){peer=new RTCPeerConnection;chan=peer.createDataChannel("x");chan.onopen=()=>launch("a");showbarcode(await gather(peer,await peer.createOffer()))}

})}

</script></body>
